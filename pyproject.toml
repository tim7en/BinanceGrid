[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-grid"
version = "0.1.0"
description = "Regime-aware multi-asset grid trading research toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["binance_grid*"]
